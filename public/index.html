<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DriveCord</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <div class="logo"><i class="fa-solid fa-hard-drive"></i></div>
      <h1>DriveCord <span class="header-sub">— Discord as File Storage</span></h1>
    </header>

    <main>
      <div class="upload-card" id="uploadZone">
        <div class="upload-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
        <div class="upload-title">파일을 드래그하거나 클릭하여 업로드</div>
        <div class="upload-hint">Discord 채널에 자동으로 분할 업로드됩니다 · 최대 2 GB</div>
        <input type="file" id="fileInput" />
      </div>

      <div class="section-hd">
        <h2>업로드된 파일</h2>
        <button class="btn-refresh" onclick="loadFiles()">
          <i class="fa-solid fa-rotate-right"></i> 새로고침
        </button>
      </div>

      <div class="file-table" id="fileTable">
        <div class="empty">
          <div class="empty-icon"><i class="fa-solid fa-folder-open"></i></div>
          <p>업로드된 파일이 없습니다</p>
        </div>
      </div>
    </main>

    <!-- Progress overlay -->
    <div class="overlay" id="overlay">
      <div class="modal">
        <div class="modal-icon" id="modalIcon">
          <i class="fa-solid fa-cloud-arrow-up"></i>
        </div>
        <h3 id="modalTitle">업로드 중...</h3>
        <div class="modal-filename" id="modalFilename"></div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-label">
          <span id="progressLabel">연결 중...</span>
          <span class="progress-pct" id="progressPct"></span>
        </div>
      </div>
    </div>

    <!-- Delete confirm modal -->
    <div class="overlay" id="deleteOverlay">
      <div class="modal confirm-modal">
        <div class="modal-icon modal-icon--danger">
          <i class="fa-solid fa-trash"></i>
        </div>
        <h3>파일 삭제</h3>
        <div class="modal-filename" id="deleteFilename"></div>
        <p class="confirm-desc">Discord에 업로드된 청크 메시지도 함께 삭제하시겠습니까?</p>
        <div class="confirm-actions">
          <button class="btn btn-confirm-cancel" onclick="closeDeleteModal()">취소</button>
          <button class="btn btn-confirm-local" onclick="confirmDelete(false)">
            <i class="fa-solid fa-database"></i> 로컬만 삭제
          </button>
          <button class="btn btn-confirm-discord" onclick="confirmDelete(true)">
            <i class="fa-brands fa-discord"></i> Discord 포함 삭제
          </button>
        </div>
      </div>
    </div>

    <!-- Toasts -->
    <div class="toast-wrap" id="toasts"></div>

    <script src="/app.js"></script>
  </body>
</html>
