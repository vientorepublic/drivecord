<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DriveCord</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <div class="logo"><i class="fa-solid fa-hard-drive"></i></div>
      <h1>DriveCord <span class="header-sub">— Discord as File Storage</span></h1>
    </header>

    <main>
      <div class="upload-card" id="uploadZone">
        <div class="upload-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
        <div class="upload-title">Drag and drop or click to upload</div>
        <div class="upload-hint">
          Automatically split and uploaded to your Discord channel · Max 2 GB
        </div>
        <input type="file" id="fileInput" />
      </div>

      <div class="section-hd">
        <h2>Uploaded Files</h2>
        <button class="btn-refresh" onclick="loadFiles()">
          <i class="fa-solid fa-rotate-right"></i> Refresh
        </button>
      </div>

      <div class="file-table" id="fileTable">
        <div class="empty">
          <div class="empty-icon"><i class="fa-solid fa-folder-open"></i></div>
          <p>No files uploaded yet</p>
        </div>
      </div>
      <div class="pagination" id="pagination" style="display: none"></div>
    </main>

    <!-- Progress overlay -->
    <div class="overlay" id="overlay">
      <div class="modal">
        <div class="modal-icon" id="modalIcon">
          <i class="fa-solid fa-cloud-arrow-up"></i>
        </div>
        <h3 id="modalTitle">Uploading...</h3>
        <div class="modal-filename" id="modalFilename"></div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-label">
          <span id="progressLabel">Connecting...</span>
          <span class="progress-pct" id="progressPct"></span>
        </div>
        <div class="modal-cancel">
          <button class="btn btn-cancel-op" onclick="cancelOperation()">
            <i class="fa-solid fa-xmark"></i> Cancel
          </button>
        </div>
      </div>
    </div>

    <!-- File detail modal -->
    <div class="overlay" id="detailOverlay" onclick="closeDetailModal(event)">
      <div class="modal detail-modal">
        <button class="detail-close" onclick="closeDetailModal()">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="detail-modal-header">
          <div class="modal-icon">
            <i class="fa-solid fa-circle-info"></i>
          </div>
          <h3 id="detailTitle"></h3>
          <div class="detail-meta" id="detailMeta"></div>
          <div class="detail-hash" id="detailHash"></div>
        </div>
        <div class="detail-section-label">Chunk List</div>
        <div class="detail-chunks" id="detailChunks"></div>
      </div>
    </div>

    <!-- Delete confirm modal -->
    <div class="overlay" id="deleteOverlay">
      <div class="modal confirm-modal">
        <div class="modal-icon modal-icon--danger">
          <i class="fa-solid fa-trash"></i>
        </div>
        <h3>Delete File</h3>
        <div class="modal-filename" id="deleteFilename"></div>
        <p class="confirm-desc">
          Do you also want to delete the chunk messages uploaded to Discord?
        </p>
        <div class="confirm-actions">
          <button class="btn btn-confirm-cancel" onclick="closeDeleteModal()">Cancel</button>
          <button class="btn btn-confirm-local" onclick="confirmDelete(false)">
            <i class="fa-solid fa-database"></i> Local Only
          </button>
          <button class="btn btn-confirm-discord" onclick="confirmDelete(true)">
            <i class="fa-brands fa-discord"></i> Include Discord
          </button>
        </div>
      </div>
    </div>

    <!-- Toasts -->
    <div class="toast-wrap" id="toasts"></div>

    <script src="/app.js"></script>
  </body>
</html>
